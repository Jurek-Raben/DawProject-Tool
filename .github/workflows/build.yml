# Builds and releases everything on every push/merge to main, all with the version of the DAW Project Tool
# (the <Version> of ffx.tools.DawProject.xrnx/manifest.xml):
#   1. the VST info tools for all platforms, built only once (vst-tools.yml)
#   2. the VST info tools as standalone command line tools, one zip per platform (package-vst-tools.yml)
#   3. the Renoise tools DAW Project Tool and Plugin Migrator, with the VST info tools of 1. inside (package-xrnx.yml)
# All files are attached to one GitHub release v<version>. A new version creates a new release, otherwise the files
# of the existing release are replaced. The release is only published if all packages were built.

name: Build xrnx

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: read
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' ffx.tools.DawProject.xrnx/manifest.xml)
          if ! echo "$version" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
            echo "Invalid version in manifest.xml: '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  vst-tools:
    name: VST tools
    uses: ./.github/workflows/vst-tools.yml

  package-vst-tools:
    name: VST tools package
    needs: [version, vst-tools]
    uses: ./.github/workflows/package-vst-tools.yml
    with:
      version: ${{ needs.version.outputs.version }}

  package-xrnx:
    name: ${{ matrix.title }}
    needs: [version, vst-tools]
    strategy:
      matrix:
        include:
          - { dir: ffx.tools.DawProject.xrnx, title: DAW Project Tool }
          - { dir: ffx.tools.PluginMigrator.xrnx, title: Plugin Migrator }
    uses: ./.github/workflows/package-xrnx.yml
    with:
      dir: ${{ matrix.dir }}
      version: ${{ needs.version.outputs.version }}

  release:
    name: Release
    needs: [version, package-vst-tools, package-xrnx]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          TITLE: DAW Project Tool v${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Same version: replace the files of the existing release.
            gh release upload "$TAG" dist/* --clobber
          else
            # The newest commit on main usually is a merge commit, so the message of the commit before is used.
            notes=$(git log -2 --pretty=format:%B | tail -n1)
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TITLE" --notes "$notes" --latest
          fi
